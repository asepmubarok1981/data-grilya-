<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAFTAR SELLER</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-2 select-none">

    <!-- MAIN COMPACT CONTAINER -->
    <div class="w-[310px] bg-slate-100 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col my-auto transition-all duration-300">
        
        <!-- HEADER -->
        <header class="bg-slate-800 text-white px-3 py-2.5 flex items-center justify-between border-b-2 border-yellow-400">
            <div class="flex items-center gap-2 overflow-hidden">
                <div class="bg-yellow-400 text-slate-900 w-7 h-7 rounded-md flex items-center justify-center font-extrabold text-xs shadow shrink-0">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div class="truncate">
                    <h1 class="font-bold text-xs tracking-wide text-yellow-400 leading-tight uppercase truncate">SELLER REBOND</h1>
                    <p class="text-[9px] text-slate-300 truncate">Pilih atau Acak Seller Aktif</p>
                </div>
            </div>
            
            <!-- Super Admin Button -->
            <button onclick="toggleUmrohModal()" class="bg-slate-700 hover:bg-slate-600 active:scale-95 transition text-[10px] px-2 py-1 rounded-md flex items-center gap-1 border border-slate-600 text-yellow-300 shrink-0">
                <i class="fa-solid fa-user-shield text-[11px] text-yellow-400"></i>
                <span class="font-medium">Admin</span>
            </button>
        </header>

        <!-- TOMBOL FITUR TAMBAHAN: SELLER AKTIF (FAST RESPON) ACAK -->
        <div class="p-2.5 bg-slate-200/80 border-b border-slate-300">
            <button onclick="mulaiAcakSellerAktif()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-95 text-white font-bold text-[10px] py-1.5 px-2 rounded-lg shadow transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-shuffle text-yellow-300"></i>
                <span>SELLER AKTIF (FAST RESPON)</span>
            </button>
        </div>

        <!-- BODY / LIST CONTENT -->
        <div class="p-2.5 space-y-1.5">
            
            <!-- Table Header Label -->
            <div class="grid grid-cols-12 px-2 py-1.5 bg-slate-200 rounded-lg font-bold text-slate-700 text-[9.5px] uppercase tracking-wider border border-slate-300/80">
                <div class="col-span-5 flex items-center gap-1">
                    <i class="fa-solid fa-users text-slate-500 text-[9px]"></i>
                    <span>Seller</span>
                </div>
                <div class="col-span-3 text-center">Status</div>
                <div class="col-span-4 text-right pr-1">Aksi</div>
            </div>

            <!-- List Sellers -->
            <div id="sellerList" class="space-y-1.5 text-xs transition-all duration-300 max-h-[260px] overflow-y-auto pr-0.5">
                <!-- Rows injected dynamically via JS -->
            </div>

        </div>

        <!-- FOOTER -->
        <footer class="bg-slate-800 border-t border-slate-700 px-3 py-2 flex flex-col gap-1.5">
            <div class="flex items-center justify-between text-[9px] text-slate-300">
                <span class="text-yellow-400 font-semibold"><i class="fa-solid fa-circle-check text-[8px] mr-0.5"></i>Official</span>
                <span class="text-slate-400">Fast Response</span>
            </div>
            <!-- Tombol Tutup -->
            <button onclick="tutupHalaman()" class="w-full bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-bold text-[10px] py-1.5 rounded-md shadow transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrow-left text-[9px]"></i> TUTUP / KEMBALI
            </button>
        </footer>
    </div>

    <!-- MODAL POPUP HASIL ACAK SELLER AKTIF -->
    <div id="acakModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3">
        <div class="bg-slate-800 text-slate-100 rounded-2xl max-w-[280px] w-full p-4 space-y-3 shadow-2xl border border-slate-700 text-center relative">
            <button onclick="tutupAcakModal()" class="absolute top-2.5 right-2.5 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="w-10 h-10 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-lg">
                <i class="fa-solid fa-award"></i>
            </div>
            <div class="space-y-1">
                <h3 class="font-bold text-yellow-400 text-xs uppercase tracking-wide">Seller Terpilih (Fast Respon)</h3>
                <div id="namaSellerTerpilih" class="font-extrabold text-sm text-white bg-slate-900 py-2 px-3 rounded-lg border border-slate-700 mt-1">
                    Mengacak...
                </div>
            </div>
            <button id="btnKirimPesanAcak" onclick="" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] rounded-lg active:scale-95 transition shadow flex items-center justify-center gap-1.5">
                <i class="fa-brands fa-whatsapp text-sm"></i>
                <span>KIRIM PESAN WA</span>
            </button>
        </div>
    </div>

    <!-- MODAL POPUP SUPER ADMIN -->
    <div id="umrohModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3">
        <div class="bg-slate-800 text-slate-100 rounded-2xl max-w-[260px] w-full p-4 space-y-3 shadow-2xl border border-slate-700 text-center relative">
            <button onclick="toggleUmrohModal()" class="absolute top-2.5 right-2.5 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="w-10 h-10 bg-yellow-400/10 text-yellow-400 border border-yellow-400/30 rounded-full flex items-center justify-center mx-auto text-lg">
                <i class="fa-solid fa-mountain"></i>
            </div>
            <div class="space-y-1">
                <h3 class="font-bold text-yellow-400 text-xs uppercase tracking-wide">Admin Sedang ber-Tapa di Goa Kelelawar</h3>
                <p class="text-[11px] text-slate-200 font-medium">Mohon Do'anya 🙏</p>
            </div>
            <button onclick="toggleUmrohModal()" class="w-full py-1.5 bg-yellow-400 text-slate-900 font-bold text-[10px] rounded-lg hover:bg-yellow-300 active:scale-95 transition shadow">
                Amiin / Tutup
            </button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-3 py-1.5 rounded-xl shadow-xl text-[11px] font-medium flex items-center gap-1.5 opacity-0 transition-all duration-300 pointer-events-none z-50 border border-slate-700">
        <i id="toastIcon" class="fa-solid fa-circle-check text-yellow-400 text-[11px]"></i>
        <span id="toastMessage">Pesan</span>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7bGqQBmAT_dojnqpADozFotAK6kH07fE2w3weHJwAjx10y24X4x6FiqTZYZDdikzu1A/exec";

        let sellersData = [];

        window.onload = function() {
            loadSellersData();
        };

        function loadSellersData() {
            const container = document.getElementById('sellerList');
            container.innerHTML = `<p class="text-center text-[10px] text-slate-400 py-3">Memuat data dari Spreadsheet...</p>`;

            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        // Hanya ambil data yang nama sellernya tidak kosong (mencegah data kosong ikut terbaca)
                        sellersData = data.filter(seller => seller.name && seller.name.trim() !== "");
                    } else {
                        sellersData = [];
                    }
                    renderSellerList();
                })
                .catch(error => {
                    console.error("Gagal memuat data:", error);
                    container.innerHTML = `<p class="text-center text-[10px] text-rose-400 py-3">Gagal memuat data seller.</p>`;
                });
        }

        function renderSellerList() {
            const container = document.getElementById('sellerList');
            container.innerHTML = '';

            if (sellersData.length === 0) {
                container.innerHTML = `<p class="text-center text-[10px] text-slate-400 py-3">Belum ada seller / data kosong.</p>`;
                return;
            }

            sellersData.forEach((seller, index) => {
                const isOn = (seller.status || "OFF") === "ON";
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 items-center gap-1.5 bg-white border border-slate-200 px-2 py-1.5 rounded-lg shadow-xs hover:border-yellow-400 transition';

                row.innerHTML = `
                    <!-- KOLOM 1: NAMA SELLER -->
                    <div class="col-span-5 flex items-center gap-1.5 overflow-hidden">
                        <div class="w-4 h-4 rounded bg-slate-800 text-yellow-400 font-bold flex items-center justify-center text-[8px] shrink-0">
                            ${index + 1}
                        </div>
                        <span class="font-bold text-slate-800 text-[10px] truncate" title="${seller.name}">${seller.name}</span>
                    </div>

                    <!-- KOLOM 2: STATUS INDIKATOR LAMPU -->
                    <div class="col-span-3 flex items-center justify-center gap-1">
                        ${isOn ? `
                            <span class="relative flex h-2 w-2 shrink-0">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.9)]"></span>
                            </span>
                            <span class="font-bold text-[9px] text-emerald-600">ON</span>
                        ` : `
                            <span class="inline-flex rounded-full h-2 w-2 bg-rose-500 shrink-0 shadow-[0_0_6px_rgba(244,63,94,0.9)]"></span>
                            <span class="font-bold text-[9px] text-rose-500">OFF</span>
                        `}
                    </div>

                    <!-- KOLOM 3: TOMBOL CHAT -->
                    <div class="col-span-4 flex justify-end">
                        ${isOn ? `
                            <button onclick="sendChat('${seller.phone}', '${seller.name}')" 
                                class="w-full py-1 px-1.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-[9px] rounded shadow-xs flex items-center justify-center gap-1 transition">
                                <i class="fa-brands fa-whatsapp text-[10px]"></i>
                                <span>Hub</span>
                            </button>
                        ` : `
                            <button onclick="showToast('Seller ${seller.name} sedang OFF / Tutup!', 'error')" 
                                class="w-full py-1 px-1.5 bg-slate-200 text-slate-400 font-bold text-[9px] rounded border border-slate-300 flex items-center justify-center gap-1 cursor-not-allowed">
                                <i class="fa-solid fa-circle-xmark text-[9px]"></i>
                                <span>Hub</span>
                            </button>
                        `}
                    </div>
                `;

                container.appendChild(row);
            });
        }

        // FUNGSI ACAK KHUSUS SELLER AKTIF (FAST RESPON) - SESUAI DATA YANG TAMPIL SAJA
        function mulaiAcakSellerAktif() {
            // Saring HANYA seller yang statusnya ON dan benar-benar ada datanya
            const activeSellers = sellersData.filter(seller => seller.name && seller.name.trim() !== "" && (seller.status || "OFF") === "ON");

            if (activeSellers.length === 0) {
                showToast('Tidak ada seller yang sedang ON saat ini!', 'error');
                return;
            }

            // Tampilkan modal acak
            const modal = document.getElementById('acakModal');
            const namaEl = document.getElementById('namaSellerTerpilih');
            const btnKirim = document.getElementById('btnKirimPesanAcak');
            modal.classList.remove('hidden');

            namaEl.innerText = "Mengacak seller aktif...";
            btnKirim.setAttribute('onclick', '');

            // Efek animasi acak nama sebentar
            let counter = 0;
            const interval = setInterval(() => {
                const randomTemp = activeSellers[Math.floor(Math.random() * activeSellers.length)];
                namaEl.innerText = randomTemp.name;
                counter++;
                if (counter > 10) {
                    clearInterval(interval);
                    // Ambil pemenang final secara acak HANYA dari seller aktif yang tampil di layar
                    const winner = activeSellers[Math.floor(Math.random() * activeSellers.length)];
                    namaEl.innerText = winner.name + " 🎉";
                    
                    // Set tombol kirim pesan ke nomor telepon pemenang terpilih
                    btnKirim.setAttribute('onclick', `sendChat('${winner.phone}', '${winner.name}'); tutupAcakModal();`);
                }
            }, 100);
        }

        function tutupAcakModal() {
            document.getElementById('acakModal').classList.add('hidden');
        }

        function sendChat(phone, sellerName) {
            if (!phone || phone.trim() === '') {
                showToast('Nomor WhatsApp seller belum diisi!', 'error');
                return;
            }

            let formattedPhone = phone.trim().replace(/[^0-9]/g, '');
            if (formattedPhone.startsWith('0')) {
                formattedPhone = '62' + formattedPhone.slice(1);
            }

            const message = encodeURIComponent(`Halo ${sellerName}, saya ingin bertransaksi / bertanya.`);
            const waUrl = `https://wa.me/${formattedPhone}?text=${message}`;

            window.open(waUrl, '_blank');
        }

        function toggleUmrohModal() {
            const modal = document.getElementById('umrohModal');
            modal.classList.toggle('hidden');
        }

        function tutupHalaman() {
            if (document.referrer && document.referrer !== window.location.href) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-yellow-400 text-[11px]";
            } else {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-[11px]";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
